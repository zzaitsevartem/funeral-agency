name: favorit-catalog

services:
  backend:
    build:
      context: ./backend
    init: true
    environment:
      DATABASE_URL: postgresql://favorit:favorit_dev@db:5432/favorit
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://127.0.0.1:${APP_PORT:-8080}}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-}
      ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:-}
      PAYMENT_MODE: ${PAYMENT_MODE:-offline}
      SEED_DEMO: ${SEED_DEMO:-false}
      UPLOAD_DIR: /app/uploads
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - default
      - data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health', { signal: AbortSignal.timeout(3000) }).then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 5s

  db:
    image: postgres:17-alpine3.23
    environment:
      POSTGRES_DB: favorit
      POSTGRES_USER: favorit
      POSTGRES_PASSWORD: favorit_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "favorit", "-d", "favorit"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  frontend:
    build: ./frontend
    init: true
    environment:
      API_INTERNAL_URL: http://backend:4000
      ADMIN_ENTRY_SLUG: ${ADMIN_ENTRY_SLUG:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/', { signal: AbortSignal.timeout(4500) }).then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 4

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  data:
    internal: true
