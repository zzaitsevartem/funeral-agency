map $uri $log_path {
    ~^/api/payments/test/ /api/payments/test/:token;
    ~^/payment/ /payment/:token;
    ~^/a-[0-9a-f]+(?:/register)?/?$ /admin-entry;
    default $uri;
}

map "$uri:$status" $log_request {
    /health:200 0;
    default 1;
}

log_format structured escape=json '{"requestId":"$request_id","method":"$request_method","path":"$log_path","status":$status,"duration":$request_time}';

server {
    listen 80;
    server_name _;
    access_log /dev/stdout structured if=$log_request;
    error_log /dev/stderr warn;

    client_max_body_size 10m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:4000;
    set $frontend http://frontend:3000;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    location = /health {
        proxy_pass $backend;
    }

    location /api/ {
        proxy_pass $backend;
    }

    location /uploads/ {
        proxy_pass $backend;
    }

    location ~ ^/a-[0-9a-f]+(?:/register)?/?$ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "no-referrer" always;
        proxy_pass $frontend;
    }

    location / {
        proxy_pass $frontend;
    }
}
